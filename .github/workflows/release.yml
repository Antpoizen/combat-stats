name: Push Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update module manifest for release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          jq --arg version "$RELEASE_VERSION" \
             --arg download "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/$RELEASE_TAG.zip" \
             '.version = $version | .download = $download' \
             module.json > module.tmp.json
          mv module.tmp.json module.json
          cat module.json

      - name: Package module
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          zip -q -r "$RUNNER_TEMP/$RELEASE_TAG.zip" . \
            -x '.git/*' '.github/*' '*.zip'
          mv "$RUNNER_TEMP/$RELEASE_TAG.zip" .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_TAG.zip" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_TAG.zip" \
              --title "Release $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
